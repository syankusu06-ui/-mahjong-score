<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻雀収支アプリ 改良版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}
main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin:0 0 4px}.muted{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center}.grid+.grid{margin-top:8px}
label{font-weight:600}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{padding:13px 18px;border:0;border-radius:10px;background:#222;color:#fff;font-size:16px;font-weight:600}button.light{background:#e8e8e8;color:#222}
.actions{display:flex;gap:8px;margin-top:16px}.result{background:#f7f7f7;border-radius:12px;padding:14px;margin-top:16px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 4px;border-bottom:1px solid #ddd;text-align:right}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.big{font-size:24px;font-weight:800}.plus{color:#087a28}.minus{color:#c62828}
.errorBox{background:#fff0f0;border:1px solid #e0a0a0;border-radius:12px;padding:14px;margin-top:16px;color:#9b0000;font-weight:700}
.ok{margin-top:12px;color:#087a28;font-weight:600}.calcScore{font-size:12px;color:#777;margin-top:2px}
</style>
</head>
<body>
<main>
<div class="card"><h1>🀄 麻雀収支アプリ</h1><div class="muted">改良版｜4麻・1局入力</div></div>
<div class="card">
<h3>最終点数・チップ</h3>
<div class="grid"><b>プレイヤー</b><b>最終点</b><b>チップ</b></div>
<div id="inputs"></div>
<div class="actions"><button onclick="calculate()">計算する</button><button class="light" onclick="location.reload()">リセット</button></div>
<div class="muted" style="margin-top:10px">※入力した実際の点数の合計を確認後、100点未満を切り上げて計算します。例：26,500点 → 27,000点。チップはこの局の増減を直接入力。</div>
</div>
<div id="result"></div>
</main>
<script>
const names=["A","自分","C","D"],defaults=[38000,27000,25000,10000],chips=[2,-1,1,-2],uma=[30,0,-10,-20];
const RETURN_POINT=30000,TOTAL_SCORE=100000;
document.getElementById("inputs").innerHTML=names.map((n,i)=>`<div class="grid" style="margin-top:8px"><label>${n}</label><input id="p${i}" type="text" value="${defaults[i]}" inputmode="text" autocomplete="off"><input id="c${i}" type="text" value="${chips[i]}" inputmode="text" autocomplete="off"></div>`).join("");
function parseNumber(v){
 const s=String(v).replace(/,/g,"").replace(/，/g,"").trim();
 if(s==="") return NaN;
 return Number(s);
}
function ceil100(n){return Math.ceil(n/100)*100}
function showError(s){document.getElementById("result").innerHTML=`<div class="errorBox">${s}</div>`}
function calculate(){
 const rawP=names.map((_,i)=>parseNumber(document.getElementById("p"+i).value));
 const c=names.map((_,i)=>{
   const v=document.getElementById("c"+i).value;
   return v===""?0:parseNumber(v);
 });
 if(rawP.some(x=>!Number.isFinite(x))){showError("⚠ 点数を正しく入力してください。");return}
 if(c.some(x=>!Number.isFinite(x))){showError("⚠ チップを正しく入力してください。");return}
 const scoreSum=rawP.reduce((a,b)=>a+b,0),chipSum=c.reduce((a,b)=>a+b,0);
 if(scoreSum!==TOTAL_SCORE){showError(`⚠ 点数合計が合いません<br>現在：${scoreSum.toLocaleString()}点<br>正しい合計：100,000点<br><span style="font-weight:600">入力した実際の点数を確認してください。</span>`);return}
 if(chipSum!==0){showError(`⚠ チップ合計が合いません<br>現在：${chipSum>0?"+":""}${chipSum}枚<br>正しい合計：0枚<br><span style="font-weight:600">チップの増減を確認してください。</span>`);return}
 const p=rawP.map(ceil100),order=[0,1,2,3].sort((a,b)=>p[b]-p[a]),pts=[0,0,0,0];
 for(let rank=3;rank>=1;rank--){const i=order[rank];pts[i]=(p[i]-RETURN_POINT)/1000+uma[rank]}
 pts[order[0]]=-(pts[order[1]]+pts[order[2]]+pts[order[3]]);
 const rows=order.map((i,r)=>({name:names[i],rank:r+1,raw:rawP[i],calc:p[i],pt:pts[i],chip:c[i],yen:pts[i]*50+c[i]*250}));
 let html=`<div class="card result"><div class="big">今回の結果</div><table><tr><th>順位</th><th>名前</th><th>ポイント</th><th>チップ</th><th>収支</th></tr>`;
 rows.forEach(x=>{const cls=x.yen>=0?"plus":"minus";html+=`<tr><td>${x.rank}着</td><td>${x.name}<div class="calcScore">${x.raw.toLocaleString()} → ${x.calc.toLocaleString()}点</div></td><td class="${x.pt>=0?"plus":"minus"}">${x.pt>=0?"+":""}${x.pt}</td><td>${x.chip>=0?"+":""}${x.chip}</td><td class="${cls}">${x.yen>=0?"+":""}${x.yen.toLocaleString()}円</td></tr>`});
 html+=`</table><div class="ok">✓ 入力点数合計 ${scoreSum.toLocaleString()}点</div><div class="ok">✓ チップ合計 0枚</div><div class="ok">✓ 計算時は各持ち点を100点単位で切り上げ</div>`;
 const me=rows.find(x=>x.name==="自分");
 html+=`<p><b>自分の今回収支：</b> <span class="${me.yen>=0?"plus":"minus"}">${me.yen>=0?"+":""}${me.yen.toLocaleString()}円</span></p><div class="muted">ポイント × 50円 ＋ チップ × 250円</div></div>`;
 document.getElementById("result").innerHTML=html;
}
calculate();
</script>
</body></html>
