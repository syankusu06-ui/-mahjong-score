<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻雀収支アプリ 試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}
main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin:0 0 4px}.muted{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center}
.grid+.grid{margin-top:8px}label{font-weight:600}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{padding:13px 18px;border:0;border-radius:10px;background:#222;color:#fff;font-size:16px;font-weight:600}button.light{background:#e8e8e8;color:#222}
.actions{display:flex;gap:8px;margin-top:16px}.result{background:#f7f7f7;border-radius:12px;padding:14px;margin-top:16px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 4px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
.big{font-size:24px;font-weight:800}.plus{color:#087a28}.minus{color:#c62828}.warn{margin-top:12px;color:#b00020;font-weight:600}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🀄 麻雀収支アプリ</h1>
<div class="muted">試作版｜4麻・1局入力</div>
</div>

<div class="card">
<h3>最終点数・チップ</h3>
<div class="grid"><b>プレイヤー</b><b>最終点</b><b>チップ</b></div>
<div id="inputs"></div>
<div class="actions">
<button onclick="calculate()">計算する</button>
<button class="light" onclick="location.reload()">リセット</button>
</div>
<div class="muted" style="margin-top:10px">※100点未満は切り上げ。チップはこの局の増減を直接入力。</div>
</div>

<div id="result"></div>
</main>

<script>
const names=["A","自分","C","D"];
const defaults=[38000,27000,25000,10000];
const chips=[2,-1,1,-2];
const uma=[30,0,-10,-20];

document.getElementById("inputs").innerHTML=names.map((n,i)=>`
<div class="grid" style="margin-top:8px">
<label>${n}</label>
<input id="p${i}" type="number" value="${defaults[i]}" step="100">
<input id="c${i}" type="number" value="${chips[i]}" step="1">
</div>`).join("");

function ceil100(n){return Math.ceil(n/100)*100}

function calculate(){
 const p=names.map((_,i)=>ceil100(Number(document.getElementById("p"+i).value)||0));
 const c=names.map((_,i)=>Number(document.getElementById("c"+i).value)||0);
 if(p.some(x=>x<0)){alert("点数を確認してください");return}

 const order=[0,1,2,3].sort((a,b)=>p[b]-p[a]);
 const pts=[0,0,0,0];

 // 4着→2着を計算し、1着は残りを受け取る
 for(let rank=3;rank>=1;rank--){
   const i=order[rank];
   pts[i]=(p[i]-30000)/1000+uma[rank];
 }
 pts[order[0]]=-(pts[order[1]]+pts[order[2]]+pts[order[3]]);

 const chipSum=c.reduce((a,b)=>a+b,0);
 const rows=order.map((i,r)=>({
   name:names[i],rank:r+1,pt:pts[i],chip:c[i],
   yen:pts[i]*50+c[i]*250
 }));

 let html=`<div class="card result">
 <div class="big">今回の結果</div>
 <table><tr><th>順位</th><th>名前</th><th>ポイント</th><th>チップ</th><th>収支</th></tr>`;
 rows.forEach(x=>{
   const cls=x.yen>=0?"plus":"minus";
   html+=`<tr><td>${x.rank}着</td><td>${x.name}</td>
   <td class="${x.pt>=0?"plus":"minus"}">${x.pt>=0?"+":""}${x.pt}</td>
   <td>${x.chip>=0?"+":""}${x.chip}</td>
   <td class="${cls}">${x.yen>=0?"+":""}${x.yen.toLocaleString()}円</td></tr>`;
 });
 html+=`</table>`;

 if(chipSum!==0){
   html+=`<div class="warn">⚠ チップ合計が ${chipSum>0?"+":""}${chipSum}枚です。合計0枚になるよう確認してください。</div>`;
 }else{
   html+=`<div class="plus">✓ チップ合計 0枚</div>`;
 }

 const me=rows.find(x=>x.name==="自分");
 html+=`<p><b>自分の今回収支：</b> <span class="${me.yen>=0?"plus":"minus"}">${me.yen>=0?"+":""}${me.yen.toLocaleString()}円</span></p>
 <div class="muted">ポイント × 50円 ＋ チップ × 250円</div></div>`;
 document.getElementById("result").innerHTML=html;
}
calculate();
</script>
</body>
</html>
