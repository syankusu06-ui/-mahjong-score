<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀収支アプリ v4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin:0 0 12px}.muted{color:#666;font-size:14px}button,select,input{font-size:16px}button{padding:12px 16px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:600}button.light{background:#e8e8e8;color:#222}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1}select,input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}.row{display:grid;grid-template-columns:1.1fr 1fr 80px;gap:8px;margin:7px 0;align-items:center}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.error{background:#fff0f0;border:1px solid #e0a0a0;border-radius:12px;padding:13px;color:#9b0000;font-weight:700;margin-top:12px}.ok{background:#eef9f0;border-radius:10px;padding:12px;color:#087a28;font-weight:600;margin-top:12px}.result table{width:100%;border-collapse:collapse}.result th,.result td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:right}.result th:first-child,.result td:first-child,.result th:nth-child(2),.result td:nth-child(2){text-align:left}.big{font-size:24px;font-weight:800}.plus{color:#087a28}.minus{color:#c62828}.totalrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid #ddd}
</style></head><body><main>
<div class="card"><h1>🀄 麻雀収支アプリ v4</h1><div class="muted">1局入力・自動計算・個人累計版</div></div>
<div class="tabs"><button class="tab" id="handTab" onclick="show('hand')">1局入力</button><button class="tab light" id="totalTab" onclick="show('total')">累計</button></div>
<section id="handPage"><div class="card"><h2>① 卓を選択</h2><select id="tableSelect" onchange="renderHand()"></select><div class="muted" id="tableInfo" style="margin-top:8px"></div></div>
<div class="card"><h2>② 最終点数・チップ</h2><div id="inputs"></div><div class="actions"><button onclick="calc()">計算して累計に追加</button><button class="light" onclick="renderHand()">入力リセット</button></div><div class="muted" style="margin-top:10px">点数は1,000点単位で切り上げて計算。26,500点→27,000点。チップは直接入力。1pt=50円、1枚=250円。</div><div id="error"></div></div><div id="result"></div></section>
<section id="totalPage" style="display:none"><div class="card"><h2>現在の累計</h2><div class="totalrow"><b>名前</b><b>ポイント</b><b>チップ</b><b>収支</b></div><div id="totals"></div><div class="actions"><button class="light" onclick="resetTotals()">累計をリセット</button></div></div></section>
</main>
<script>
const DEF_P=[{id:1,name:"自分"},{id:2,name:"A"},{id:3,name:"B"},{id:4,name:"C"},{id:5,name:"D"},{id:6,name:"E"},{id:7,name:"F"},{id:8,name:"G"},{id:9,name:"H"},{id:10,name:"I"},{id:11,name:"J"}];
const DEF_T=[{name:"卓1",mode:4,players:[1,2,3,4]},{name:"卓2",mode:4,players:[5,6,7,8]},{name:"卓3",mode:3,players:[9,10,11]}];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||structuredClone(d)}catch(e){return structuredClone(d)}} 
let players=load("mahjong_v3_players",DEF_P),tables=load("mahjong_v3_tables",DEF_T),totals=load("mahjong_v4_totals",players.map(p=>({id:p.id,points:0,chips:0,hands:0})));
function P(id){return players.find(x=>x.id===id)} function T(id){let x=totals.find(x=>x.id===id);if(!x){x={id,points:0,chips:0,hands:0};totals.push(x)}return x} function Y(t){return t.points*50+t.chips*250}
function show(x){handPage.style.display=x==="hand"?"block":"none";totalPage.style.display=x==="total"?"block":"none";handTab.className=x==="hand"?"tab":"tab light";totalTab.className=x==="total"?"tab":"tab light";if(x==="total")renderTotals()}
function renderSelect(){tableSelect.innerHTML=tables.map((t,i)=>`<option value="${i}">${t.name}（${t.mode}麻）</option>`).join("")}
function renderHand(){let t=tables[Number(tableSelect.value||0)],n=t.mode===4?4:3;tableInfo.textContent=`${t.name}｜${t.mode}麻｜${n}人`;inputs.innerHTML=t.players.slice(0,n).map((id,i)=>`<div class="row"><b>${P(id)?.name||"未設定"}</b><input id="s${i}" type="text" inputmode="decimal" value="${t.mode===4?[38000,27000,25000,10000][i]:[40000,40000,40000][i]}"><input id="c${i}" type="text" inputmode="decimal" value="0" placeholder="チップ"></div>`).join("");error.innerHTML="";result.innerHTML=""}
function calc(){let t=tables[Number(tableSelect.value||0)],n=t.mode===4?4:3,ret=t.mode===4?30000:40000,uma=t.mode===4?[30,0,-10,-20]:[20,0,-20],sumNeed=t.mode===4?100000:120000,raw=[],chips=[];for(let i=0;i<n;i++){raw.push(Number(document.getElementById("s"+i).value));chips.push(Number(document.getElementById("c"+i).value)||0)}if(raw.some(x=>!Number.isFinite(x)||x<0)){error.innerHTML='<div class="error">⚠ 点数を正しく入力してください。</div>';return}let ss=raw.reduce((a,b)=>a+b,0),cs=chips.reduce((a,b)=>a+b,0);if(ss!==sumNeed){error.innerHTML=`<div class="error">⚠ 点数合計が合いません<br>現在：${ss.toLocaleString()}点 ／ 正しい合計：${sumNeed.toLocaleString()}点</div>`;return}if(cs!==0){error.innerHTML=`<div class="error">⚠ チップ合計が合いません<br>現在：${cs>0?"+":""}${cs}枚 ／ 正しい合計：0枚</div>`;return}let p=raw.map(x=>Math.ceil(x/1000)*1000),ord=[...Array(n).keys()].sort((a,b)=>p[b]-p[a]),pts=Array(n).fill(0);for(let r=n-1;r>=1;r--){let i=ord[r];pts[i]=(p[i]-ret)/1000+uma[r]}pts[ord[0]]=-(pts.reduce((a,b)=>a+b,0));let rows=ord.map((i,r)=>({id:t.players[i],name:P(t.players[i])?.name||"未設定",rank:r+1,raw:raw[i],calc:p[i],pt:pts[i],chip:chips[i],yen:pts[i]*50+chips[i]*250}));rows.forEach(x=>{let z=T(x.id);z.points+=x.pt;z.chips+=x.chip;z.hands++});localStorage.setItem("mahjong_v4_totals",JSON.stringify(totals));let me=rows.find(x=>x.id===1),mt=T(1);result.innerHTML=`<div class="card result"><div class="big">今回の結果</div><table><tr><th>順位</th><th>名前</th><th>ポイント</th><th>チップ</th><th>収支</th></tr>${rows.map(x=>`<tr><td>${x.rank}着</td><td>${x.name}<div class="muted">${x.raw.toLocaleString()}→${x.calc.toLocaleString()}点</div></td><td class="${x.pt>=0?"plus":"minus"}">${x.pt>=0?"+":""}${x.pt}</td><td>${x.chip>=0?"+":""}${x.chip}</td><td class="${x.yen>=0?"plus":"minus"}">${x.yen>=0?"+":""}${x.yen.toLocaleString()}円</td></tr>`).join("")}</table><div class="ok">✓ この局を累計に追加しました</div><p><b>自分の今回：</b>${me.yen>=0?"+":""}${me.yen.toLocaleString()}円</p><p><b>自分の累計：</b><span class="${Y(mt)>=0?"plus":"minus"}">${Y(mt)>=0?"+":""}${Y(mt).toLocaleString()}円</span></p></div>`}
function renderTotals(){totalsDiv.innerHTML=players.map(p=>{let t=T(p.id),y=Y(t);return `<div class="totalrow"><b>${p.name}</b><span class="${t.points>=0?"plus":"minus"}">${t.points>=0?"+":""}${t.points}</span><span>${t.chips>=0?"+":""}${t.chips}</span><span class="${y>=0?"plus":"minus"}">${y>=0?"+":""}${y.toLocaleString()}円</span></div>`}).join("")}
function resetTotals(){if(confirm("累計をリセットしますか？")){totals=players.map(p=>({id:p.id,points:0,chips:0,hands:0}));localStorage.setItem("mahjong_v4_totals",JSON.stringify(totals));renderTotals()}}
const totalsDiv=document.getElementById("totals");renderSelect();renderHand();
</script></body></html>
