<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻雀収支アプリ v5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin:0 0 12px}
.muted{color:#666;font-size:14px}
button,select,input{font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:600}
button.light{background:#e8e8e8;color:#222}
button.confirm{background:#087a28}
button:disabled{opacity:.45}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1}
select,input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}
.row{display:grid;grid-template-columns:1.1fr 1fr 80px;gap:8px;margin:7px 0;align-items:center}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.error{background:#fff0f0;border:1px solid #e0a0a0;border-radius:12px;padding:13px;color:#9b0000;font-weight:700;margin-top:12px}
.ok{background:#eef9f0;border-radius:10px;padding:12px;color:#087a28;font-weight:600;margin-top:12px}
.warning{background:#fff8df;border:1px solid #e3c76b;border-radius:10px;padding:12px;margin:12px 0;font-weight:700}
.result table{width:100%;border-collapse:collapse}.result th,.result td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:right}
.result th:first-child,.result td:first-child,.result th:nth-child(2),.result td:nth-child(2){text-align:left}
.big{font-size:24px;font-weight:800}.plus{color:#087a28}.minus{color:#c62828}
.totalrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid #ddd}
.calcscore{font-size:12px;color:#666;margin-top:2px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🀄 麻雀収支アプリ v5</h1>
<div class="muted">1局入力・確認して確定・日別／トータル成績版</div>
<div style="margin-top:12px">
 <label class="muted">対局日（最初に入力）</label>
 <input id="sessionDate" type="date">
 <div class="muted" style="margin-top:5px">日をまたいで対局しても、この日付を基準に「1日の累計」を集計します。</div>
</div>
</div>

<div class="tabs">
<button class="tab" id="handTab" onclick="showPage('hand')">1局入力</button>
<button class="tab light" id="totalTab" onclick="showPage('total')">累計</button>
<button class="tab light" id="historyTab" onclick="showPage('history')">局履歴</button>
</div>

<section id="handPage">
<div class="card">
<h2>① 卓を選択</h2>
<select id="tableSelect" onchange="renderHand()"></select>
<div class="muted" id="tableInfo" style="margin-top:8px"></div>
</div>

<div class="card">
<h2>② 最終点数・チップ</h2>
<div id="inputs"></div>
<div class="actions">
<button id="calcButton" onclick="calc()">計算する</button>
<button class="light" onclick="renderHand()">入力リセット</button>
</div>
<div class="muted" style="margin-top:10px">
点数は1,000点単位で切り上げて計算。26,500点→27,000点。<br>
チップは直接入力。<b>-2 / +2</b>のように入力できます。1pt=50円、1枚=250円。
</div>
<div id="error"></div>
</div>
<div id="result"></div>
</section>

<section id="historyPage" style="display:none">
<div class="card">
<h2>局ごとの成績</h2>
<div id="history"></div>
<div class="actions"><button class="light" onclick="resetHistory()">局履歴をリセット</button></div>
</div>
</section>

<section id="totalPage" style="display:none">
<div class="card">
<h2>今日の累計</h2>
<div class="muted" id="dailyDateLabel"></div>
<div class="totalrow"><b>名前</b><b>ポイント</b><b>チップ</b><b>収支</b></div>
<div id="dailyTotals"></div>
</div>
<div class="card">
<h2>トータル累計</h2>
<div class="muted">保存されている全対局の累計</div>
<div class="totalrow"><b>名前</b><b>ポイント</b><b>チップ</b><b>収支</b></div>
<div id="totals"></div>
<div class="actions"><button class="light" onclick="resetTotals()">トータル累計をリセット</button></div>
</div>
</section>
</main>

<script>
const DEF_P=[
{id:1,name:"自分"},{id:2,name:"A"},{id:3,name:"B"},{id:4,name:"C"},
{id:5,name:"D"},{id:6,name:"E"},{id:7,name:"F"},{id:8,name:"G"},
{id:9,name:"H"},{id:10,name:"I"},{id:11,name:"J"}
];
const DEF_T=[
{name:"卓1",mode:4,players:[1,2,3,4]},
{name:"卓2",mode:4,players:[5,6,7,8]},
{name:"卓3",mode:3,players:[9,10,11]}
];

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(k,d){
 try{return JSON.parse(localStorage.getItem(k))||clone(d)}
 catch(e){return clone(d)}
}

let players=load("mahjong_v3_players",DEF_P);
let tables=load("mahjong_v3_tables",DEF_T);
let totals=load("mahjong_v4_totals",players.map(p=>({id:p.id,points:0,chips:0,hands:0})));
let pending=null;
let history=load("mahjong_v5_history",[]);
const todayISO=new Date().toISOString().slice(0,10);
let sessionDate=localStorage.getItem("mahjong_v5_session_date")||todayISO;

function P(id){return players.find(x=>x.id===id)}
function T(id){
 let x=totals.find(x=>x.id===id);
 if(!x){x={id,points:0,chips:0,hands:0};totals.push(x)}
 return x;
}
function Y(t){return t.points*50+t.chips*250}

function signed(v){
 v=String(v).trim().replace(/[＋]/g,"+").replace(/[－−]/g,"-");
 if(v==="") return 0;
 if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(v)) return NaN;
 return Number(v);
}

function showPage(x){
 handPage.style.display=x==="hand"?"block":"none";
 totalPage.style.display=x==="total"?"block":"none";
 historyPage.style.display=x==="history"?"block":"none";
 handTab.className=x==="hand"?"tab":"tab light";
 totalTab.className=x==="total"?"tab":"tab light";
 historyTab.className=x==="history"?"tab":"tab light";
 if(x==="total"){renderDailyTotals();renderTotals();}
 if(x==="history")renderHistory();
}

function renderSelect(){
 tableSelect.innerHTML=tables.map((t,i)=>`<option value="${i}">${t.name}（${t.mode}麻）</option>`).join("");
}

function renderHand(){
 pending=null;
 calcButton.disabled=false;
 let t=tables[Number(tableSelect.value||0)];
 let n=t.mode===4?4:3;
 tableInfo.textContent=`${t.name}｜${t.mode}麻｜${n}人`;
 let defaults=t.mode===4?[38000,27000,25000,10000]:[40000,40000,40000];
 inputs.innerHTML=t.players.slice(0,n).map((id,i)=>`
 <div class="row">
 <b>${P(id)?.name||"未設定"}</b>
 <input id="s${i}" type="text" inputmode="text" value="${defaults[i]}" placeholder="点数（例：-500）" autocomplete="off">
 <input id="c${i}" type="text" inputmode="text" value="0" placeholder="チップ 例：-2" autocomplete="off">
 </div>`).join("");
 inputs.innerHTML += `<div style="margin-top:12px">
 <label class="muted">飛ばした人（トビがある場合のみ）</label>
 <select id="tobiFrom"><option value="">なし</option>${t.players.slice(0,n).map(id=>`<option value="${id}">${P(id)?.name||"未設定"}</option>`).join("")}</select>
 </div>`;
 error.innerHTML="";
 result.innerHTML="";
}

function calc(){
 sessionDate=sessionDateInput.value;
 if(!sessionDate){
   error.innerHTML='<div class="error">⚠ 対局日を入力してください。</div>';
   return;
 }
 if(pending){
   error.innerHTML='<div class="error">⚠ すでに計算済みです。内容を確認して「この局を確定」してください。</div>';
   return;
 }

 let t=tables[Number(tableSelect.value||0)];
 let n=t.mode===4?4:3;
 let ret=t.mode===4?30000:40000;
 let uma=t.mode===4?[30,0,-10,-20]:[20,0,-20];
 let need=t.mode===4?100000:120000;
 let raw=[],chips=[];

 for(let i=0;i<n;i++){
   raw.push(signed(document.getElementById("s"+i).value));
   chips.push(signed(document.getElementById("c"+i).value));
 }

 if(raw.some(x=>!Number.isFinite(x))){
   error.innerHTML='<div class="error">⚠ 点数を正しく入力してください。</div>';return;
 }
 if(chips.some(x=>!Number.isFinite(x))){
   error.innerHTML='<div class="error">⚠ チップは -2 / +2 のように入力してください。</div>';return;
 }

 let scoreSum=raw.reduce((a,b)=>a+b,0);
 let chipSum=chips.reduce((a,b)=>a+b,0);

 if(scoreSum!==need){
   error.innerHTML=`<div class="error">⚠ 点数合計が合いません<br>現在：${scoreSum.toLocaleString()}点 ／ 正しい合計：${need.toLocaleString()}点</div>`;
   return;
 }
 if(chipSum!==0){
   error.innerHTML=`<div class="error">⚠ チップ合計が合いません<br>現在：${chipSum>0?"+":""}${chipSum}枚 ／ 正しい合計：0枚</div>`;
   return;
 }

 let p=raw.map(x=>Math.ceil(x/1000)*1000);
 let ord=[...Array(n).keys()].sort((a,b)=>p[b]-p[a]);
 let pts=Array(n).fill(0);
 let tobiIndex=p.findIndex(x=>x<0);
 let tobiFromId=String(document.getElementById("tobiFrom").value||"");
 let tobiFromIndex=tobiFromId? t.players.findIndex(id=>String(id)===tobiFromId):-1;

 for(let r=n-1;r>=1;r--){
   let i=ord[r];
   pts[i]=(p[i]-ret)/1000+uma[r];
 }
 pts[ord[0]]=-(pts.reduce((a,b)=>a+b,0));

 if(tobiIndex>=0){
   if(tobiFromIndex<0){
     error.innerHTML='<div class="error">⚠ トビがあるため、「飛ばした人」を選択してください。</div>';return;
   }
   if(tobiFromIndex===tobiIndex){
     error.innerHTML='<div class="error">⚠ 飛ばした人とトビの人は別にしてください。</div>';return;
   }
   pts[tobiFromIndex]+=10;
   pts[tobiIndex]-=10;
 } else if(tobiFromIndex>=0){
   error.innerHTML='<div class="error">⚠ トビがない場合は「飛ばした人」を「なし」にしてください。</div>';return;
 }

 let rows=ord.map((i,r)=>({
   id:t.players[i],
   name:P(t.players[i])?.name||"未設定",
   rank:r+1,
   raw:raw[i],
   calc:p[i],
   pt:pts[i],
   chip:chips[i],
   tobi:i===tobiIndex,
   tobiFrom:i===tobiFromIndex,
   yen:pts[i]*50+chips[i]*250
 }));

 pending={rows,tableName:t.name,mode:t.mode,tobiIndex,tobiFromIndex};
 renderPending();
 error.innerHTML="";
}

function renderPending(){
 let rows=pending.rows;
 let me=rows.find(x=>x.id===1);

 let html=`<div class="card result">
 <div class="big">今回の結果（未確定）</div>
 <div class="warning">⚠ まだ累計には加算していません。内容を確認してから確定してください。</div>
 <table>
 <tr><th>順位</th><th>名前</th><th>ポイント</th><th>チップ</th><th>収支</th></tr>`;

 rows.forEach(x=>{
   html+=`<tr>
   <td>${x.rank}着</td>
   <td>${x.name}${x.tobi?' <b>🛫トビ</b>':''}${x.tobiFrom?' <b>✈️飛ばし</b>':''}<div class="calcscore">${x.raw.toLocaleString()} → ${x.calc.toLocaleString()}点</div></td>
   <td class="${x.pt>=0?"plus":"minus"}">${x.pt>=0?"+":""}${x.pt}</td>
   <td class="${x.chip>=0?"plus":"minus"}">${x.chip>=0?"+":""}${x.chip}</td>
   <td class="${x.yen>=0?"plus":"minus"}">${x.yen>=0?"+":""}${x.yen.toLocaleString()}円</td>
   </tr>`;
 });

 html+=`</table>
 ${me?`<p><b>自分の今回：</b>
 <span class="${me.yen>=0?"plus":"minus"}">${me.yen>=0?"+":""}${me.yen.toLocaleString()}円</span></p>`:""}
 <div class="actions">
 <button class="confirm" onclick="confirmHand()">✓ この局を確定して累計に追加</button>
 <button class="light" onclick="cancelPending()">修正する</button>
 </div>
 </div>`;

 result.innerHTML=html;
 calcButton.disabled=true;
}

function confirmHand(){
 if(!pending)return;

 pending.rows.forEach(x=>{
   let z=T(x.id);
   z.points+=x.pt;
   z.chips+=x.chip;
   z.hands++;
 });

 history.push({
   id:Date.now(),
   date:sessionDate,
   time:new Date().toLocaleString("ja-JP"),
   tableName:pending.tableName,
   mode:pending.mode,
   rows:clone(pending.rows)
 });

 localStorage.setItem("mahjong_v4_totals",JSON.stringify(totals));
 localStorage.setItem("mahjong_v5_history",JSON.stringify(history));

 let me=pending.rows.find(x=>x.id===1);
 let mt=T(1);

 result.innerHTML=`<div class="card result">
 <div class="big">✓ この局を確定しました</div>
 <div class="ok">累計への加算が完了しました。</div>
 ${me?`<p><b>自分の今回：</b>
 <span class="${me.yen>=0?"plus":"minus"}">${me.yen>=0?"+":""}${me.yen.toLocaleString()}円</span></p>
 <p><b>自分の累計：</b>
 <span class="${Y(mt)>=0?"plus":"minus"}">${Y(mt)>=0?"+":""}${Y(mt).toLocaleString()}円</span></p>`:""}
 <div class="muted">累計ポイント ${mt.points>=0?"+":""}${mt.points}pt ／ 累計チップ ${mt.chips>=0?"+":""}${mt.chips}枚</div>
 </div>`;

 pending=null;
 calcButton.disabled=false;
}

function cancelPending(){
 pending=null;
 result.innerHTML="";
 error.innerHTML='<div class="ok">修正できます。入力を直して、もう一度「計算する」を押してください。</div>';
 calcButton.disabled=false;
}

function renderHistory(){
 if(history.length===0){
   historyDiv.innerHTML='<div class="muted">まだ確定した局がありません。</div>';
   return;
 }
 historyDiv.innerHTML=[...history].reverse().map((h,idx)=>`
 <div class="card" style="box-shadow:none;border:1px solid #ddd;margin:10px 0;padding:12px">
   <b>${history.length-idx}局目｜${h.date||"日付未設定"}｜${h.tableName}｜${h.mode}麻</b>
   <div class="muted" style="margin:4px 0 8px">${h.time}</div>
   <table class="result" style="width:100%;border-collapse:collapse">
   <tr><th>順位</th><th>名前</th><th>点</th><th>チップ</th><th>収支</th></tr>
   ${h.rows.map(x=>`<tr><td>${x.rank}着</td><td style="text-align:left">${x.name}${x.tobi?' 🛫トビ':''}${x.tobiFrom?' ✈️飛ばし':''}</td><td class="${x.pt>=0?'plus':'minus'}">${x.pt>=0?'+':''}${x.pt}</td><td class="${x.chip>=0?'plus':'minus'}">${x.chip>=0?'+':''}${x.chip}</td><td class="${x.yen>=0?'plus':'minus'}">${x.yen>=0?'+':''}${x.yen.toLocaleString()}円</td></tr>`).join('')}
   </table>
 </div>`).join('');
}

function resetHistory(){
 if(confirm("局履歴をリセットしますか？")){
   history=[];
   localStorage.setItem("mahjong_v5_history",JSON.stringify(history));
   renderHistory();
 }
}

function renderDailyTotals(){
 const d=sessionDateInput.value||sessionDate||todayISO;
 dailyDateLabel.textContent=`対局日：${d}`;
 const daily={};
 players.forEach(p=>daily[p.id]={id:p.id,points:0,chips:0,hands:0});
 history.filter(h=>(h.date||"")===d).forEach(h=>{
   h.rows.forEach(x=>{
     if(!daily[x.id]) daily[x.id]={id:x.id,points:0,chips:0,hands:0};
     daily[x.id].points+=x.pt||0;
     daily[x.id].chips+=x.chip||0;
     daily[x.id].hands++;
   });
 });
 dailyTotalsDiv.innerHTML=players.map(p=>{
   let t=daily[p.id],y=Y(t);
   return `<div class="totalrow">
   <b>${p.name}</b>
   <span class="${t.points>=0?"plus":"minus"}">${t.points>=0?"+":""}${t.points}</span>
   <span>${t.chips>=0?"+":""}${t.chips}</span>
   <span class="${y>=0?"plus":"minus"}">${y>=0?"+":""}${y.toLocaleString()}円</span>
   </div>`;
 }).join("");
}

function renderTotals(){
 totalsDiv.innerHTML=players.map(p=>{
   let t=T(p.id),y=Y(t);
   return `<div class="totalrow">
   <b>${p.name}</b>
   <span class="${t.points>=0?"plus":"minus"}">${t.points>=0?"+":""}${t.points}</span>
   <span>${t.chips>=0?"+":""}${t.chips}</span>
   <span class="${y>=0?"plus":"minus"}">${y>=0?"+":""}${y.toLocaleString()}円</span>
   </div>`;
 }).join("");
}

function resetTotals(){
 if(confirm("累計をリセットしますか？")){
   totals=players.map(p=>({id:p.id,points:0,chips:0,hands:0}));
   localStorage.setItem("mahjong_v4_totals",JSON.stringify(totals));
   renderTotals();
 }
}

const totalsDiv=document.getElementById("totals");
const dailyTotalsDiv=document.getElementById("dailyTotals");
const dailyDateLabel=document.getElementById("dailyDateLabel");
const historyDiv=document.getElementById("history");
const sessionDateInput=document.getElementById("sessionDate");
sessionDateInput.value=sessionDate;
sessionDateInput.addEventListener("change",()=>{
 sessionDate=sessionDateInput.value;
 localStorage.setItem("mahjong_v5_session_date",sessionDate);
 if(document.getElementById("totalPage").style.display!=="none"){
   renderDailyTotals();
   renderTotals();
 }
});
renderSelect();
renderHand();
</script>
</body>
</html>
